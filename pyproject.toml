[project]
name = "production-rag-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alasali1", email = "alasali96@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "ddgs>=9.16.1",
    "fastapi>=0.162.3",
    "openai>=3.49.0",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.67.0",
    "tavily-python>=0.8.5",
    "torch>=2.15.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
production-rag-pipeline = "production_rag_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls real OpenAI / ChromaDB / web-search services (skipped when OPENAI_API_KEY is not set)",
]

# Linux (Docker) builds use CPU-only torch: the default PyPI wheel pulls ~several GB of CUDA libraries
# this app never uses. Windows/macOS keep resolving torch from PyPI (already CPU / MPS builds).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
